<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متتبع إنجاز تقييم الأداء الوظيفي</title>
<style>
  :root{
    --teal-dark:#0f3d3e;
    --teal:#1a7a6e;
    --green:#3fae5a;
    --green-light:#e8f6ec;
    --bg:#f4f7f6;
    --card:#ffffff;
    --border:#e1e8e6;
    --text:#1e2b28;
    --muted:#6b7c78;
    --amber:#e8a33d;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1513;
      --card:#161f1c;
      --border:#243330;
      --text:#eef3f1;
      --muted:#9db0ab;
      --green-light:#173327;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1513;
    --card:#161f1c;
    --border:#243330;
    --text:#eef3f1;
    --muted:#9db0ab;
    --green-light:#173327;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(120deg,var(--teal-dark),var(--teal));
    color:#fff;
    padding:28px 20px 22px;
    padding-top:calc(28px + env(safe-area-inset-top, 0px));
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
  }
  header h1{margin:0 0 6px;font-size:22px;}
  header p{margin:0;opacity:.9;font-size:14px;}

  .wrap{max-width:820px;margin:0 auto;padding:18px 14px;}

  .summary{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    margin-top:-30px;
    margin-bottom:20px;
    position:relative;
    z-index:2;
  }
  .summary-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .score-circle{
    width:84px;height:84px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:conic-gradient(var(--green) calc(var(--pct)*1%), #e6ece9 0);
    flex-shrink:0;
  }
  .score-circle .inner{
    width:66px;height:66px;border-radius:50%;background:var(--card);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
  }
  .score-circle .inner b{font-size:18px;}
  .score-circle .inner span{font-size:10px;color:var(--muted);}
  .summary-text{flex:1;min-width:180px;}
  .summary-text h2{margin:0 0 4px;font-size:16px;}
  .summary-text p{margin:0;color:var(--muted);font-size:13px;}
  .bar-outer{height:10px;background:#e6ece9;border-radius:6px;margin-top:14px;overflow:hidden;}
  .bar-inner{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));width:0%;transition:width .4s;}

  .controls{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .btn{
    border:none;padding:9px 14px;border-radius:10px;font-size:13px;cursor:pointer;
    background:var(--teal);color:#fff;font-weight:600;
  }
  .btn.secondary{background:#eef3f2;color:var(--teal-dark);}
  .btn.danger{background:#fdecec;color:#c0392b;}

  .cat{
    background:var(--card);
    border-radius:14px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    overflow:hidden;
    border:1px solid var(--border);
  }
  .cat-head{
    padding:14px 16px;
    display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;
    gap:10px;
  }
  .cat-head .left{display:flex;align-items:center;gap:10px;}
  .cat-num{
    width:28px;height:28px;border-radius:50%;
    background:var(--green-light);color:var(--teal-dark);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;flex-shrink:0;
  }
  .cat-title{font-size:14.5px;font-weight:700;}
  .cat-weight{
    font-size:11.5px;background:var(--green-light);color:var(--teal);
    padding:2px 8px;border-radius:20px;font-weight:700;
  }
  .cat-progress{font-size:12px;color:var(--muted);}
  .chev{transition:transform .25s;color:var(--muted);}
  .cat.open .chev{transform:rotate(180deg);}

  .cat-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
    border-top:1px solid var(--border);
  }
  .cat.open .cat-body{max-height:1200px;}

  .item-list{padding:10px 16px 14px;}
  .item{
    display:flex;align-items:flex-start;gap:10px;
    padding:9px 0;border-bottom:1px dashed var(--border);
  }
  .item:last-child{border-bottom:none;}
  .item input[type=checkbox]{
    width:19px;height:19px;margin-top:2px;flex-shrink:0;accent-color:var(--green);cursor:pointer;
  }
  .item label{font-size:13.5px;line-height:1.5;cursor:pointer;flex:1;}
  .item.done label{color:var(--muted);text-decoration:line-through;}

  .mini-bar-outer{height:6px;background:var(--border);border-radius:4px;margin:0 16px 14px;overflow:hidden;}
  .mini-bar-inner{height:100%;background:var(--green);width:0%;transition:width .3s;}

  footer{
    text-align:center;color:var(--muted);font-size:12px;padding:20px;
  }
</style>
</head>
<body>

<header>
  <h1>📋 متتبع إنجاز تقييم الأداء الوظيفي</h1>
  <p>نموذج تقييم أداء المعلم — حسب الدليل الإرشادي (الإصدار الثالث) لوزارة التعليم</p>
</header>

<div class="wrap">

  <div class="summary">
    <div class="summary-top">
      <div class="score-circle" id="scoreCircle" style="--pct:0">
        <div class="inner"><b id="pctText">0%</b><span>الإنجاز</span></div>
      </div>
      <div class="summary-text">
        <h2>نسبة اكتمال الشواهد الكلية</h2>
        <p id="statsText">0 من 0 شاهد مكتمل</p>
      </div>
    </div>
    <div class="bar-outer"><div class="bar-inner" id="mainBar"></div></div>
    <div class="controls">
      <button class="btn secondary" id="expandAll">فتح الكل</button>
      <button class="btn secondary" id="collapseAll">طي الكل</button>
      <button class="btn danger" id="resetAll">تصفير التقدم</button>
    </div>
  </div>

  <div id="categories"></div>

</div>

<footer>يُحفظ تقدمك تلقائيًا على هذا الجهاز/المتصفح فقط — راجعي الدليل الأصلي لأي تفاصيل إضافية.</footer>

<script>
const DATA = [
  {title:"أداء الواجبات الوظيفية", weight:10, items:[
    "سجل الدوام الرسمي / تطبيق حضوري",
    "سجل المناوبة والإشراف اليومي",
    "قرارات التكليفات واللجان",
    "جدول الحصص الدراسي",
    "تفعيل حصص الانتظار",
    "الأنشطة والبرامج المدرسية والوطنية",
    "تقارير تنفيذ المهام والتكليفات والأنشطة"
  ]},
  {title:"التفاعل مع المجتمع المهني", weight:10, items:[
    "شهادات حضور الدورات والورش التدريبية",
    "تنفيذ دورات وبرامج تدريبية وورش عمل",
    "ساعات التطوع / العمل التطوعي",
    "إطلاق المبادرات التعليمية",
    "سجل المجتمعات المهنية",
    "تبادل الزيارات",
    "الإنتاج المعرفي (درس تطبيقي – مقطع مرئي – بحث إجرائي – بحث درس)"
  ]},
  {title:"التفاعل مع أولياء الأمور", weight:10, items:[
    "سجل التواصل مع أولياء الأمور",
    "صور تفعيل الإشعارات وإعلانات من المنصة",
    "مشاركات أولياء الأمور",
    "تقرير اجتماع مع ولي أمر"
  ]},
  {title:"التنويع في استراتيجيات التدريس", weight:10, items:[
    "نماذج دروس موضح فيها الاستراتيجيات المستخدمة",
    "صور تطبيق الاستراتيجيات داخل الصف",
    "تقرير عن تطبيق استراتيجية"
  ]},
  {title:"تحسين نتائج المتعلمين", weight:10, items:[
    "تنفيذ الاختبارات التشخيصية",
    "الخطط العلاجية والإثرائية",
    "تحسين نتائج الطلبة في الاختبارات الوطنية (نافس / التحصيل / الفهم القرائي)",
    "تكريم الطلبة المتميزين والذين تحسّن مستواهم"
  ]},
  {title:"إعداد وتنفيذ خطة التعلم", weight:10, items:[
    "خطة توزيع المنهج",
    "الخطة الأسبوعية / الفصلية",
    "إعداد وتحضير الدروس",
    "تنفيذ خطط التعلم والنشاط في الوقت المحدد",
    "نماذج من الواجبات وأوراق العمل"
  ]},
  {title:"توظيف تقنيات ووسائل التعلم المناسبة", weight:10, items:[
    "نماذج الوسائل التعليمية المستخدمة",
    "صور استخدام السبورة التفاعلية",
    "أنشطة إلكترونية عبر المنصات التعليمية (مثل منصة مدرستي)",
    "تقرير عن برنامج تقني تم استخدامه"
  ]},
  {title:"تهيئة بيئة تعليمية", weight:5, items:[
    "صور تنظيم البيئة الصفية",
    "صور تجهيز الصف وفق موضوع الدرس",
    "تقرير تصنيف الطلبة وفق أنماط التعلم",
    "نماذج من التحفيز المادي والمعنوي"
  ]},
  {title:"الإدارة الصفية", weight:5, items:[
    "سجل متابعة الطلبة: الحضور، السلوك، والالتزام بالواجبات",
    "خطة إدارة الصف والقواعد والإجراءات الصفية",
    "نموذج متابعة إدارة وقت الحصة والمواقف الصفية"
  ]},
  {title:"تحليل نتائج المتعلمين وتشخيص مستوياتهم", weight:10, items:[
    "خطة / تقرير معالجة الفاقد التعليمي",
    "تحليل نتائج الاختبارات",
    "كشف تصنيف المتعلمين حسب مستوياتهم",
    "تقرير تشخيص نقاط القوة والاحتياج"
  ]},
  {title:"تنوع أساليب التقويم", weight:10, items:[
    "نماذج التقويم القبلي والتكويني والختامي",
    "تطبيق الاختبارات الورقية والإلكترونية",
    "نماذج ملفات إنجاز المتعلمين",
    "المهام الأدائية ومشاريع الطلبة",
    "نماذج التغذية الراجعة المقدمة للمتعلمين"
  ]}
];

const STORAGE_KEY = "teacher_eval_progress_v1";
let state = {};

function itemKey(ci, ii){ return ci + "-" + ii; }

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ state = {}; }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* تجاهل أي خطأ تخزين */ }
}

function render(){
  const container = document.getElementById("categories");
  const openIds = new Set(
    Array.from(document.querySelectorAll(".cat.open")).map(el => el.dataset.ci)
  );
  container.innerHTML = "";

  let totalItems = 0, doneItems = 0;
  let weightedScore = 0, totalWeight = 0;

  DATA.forEach((cat, ci) => {
    totalWeight += cat.weight;
    const catDoneCount = cat.items.filter((_, ii) => state[itemKey(ci, ii)]).length;
    const catPct = Math.round((catDoneCount / cat.items.length) * 100);
    weightedScore += (catPct/100) * cat.weight;
    totalItems += cat.items.length;
    doneItems += catDoneCount;

    const catEl = document.createElement("div");
    catEl.className = "cat" + (openIds.has(String(ci)) ? " open" : "");
    catEl.dataset.ci = ci;
    catEl.innerHTML = `
      <div class="cat-head">
        <div class="left">
          <div class="cat-num">${ci+1}</div>
          <div>
            <div class="cat-title">${cat.title}</div>
            <div class="cat-progress">${catDoneCount} / ${cat.items.length} شاهد مكتمل</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="cat-weight">${cat.weight}%</span>
          <span class="chev">▾</span>
        </div>
      </div>
      <div class="mini-bar-outer"><div class="mini-bar-inner" style="width:${catPct}%"></div></div>
      <div class="cat-body">
        <div class="item-list">
          ${cat.items.map((txt, ii) => `
            <div class="item ${state[itemKey(ci,ii)] ? 'done':''}">
              <input type="checkbox" id="chk-${ci}-${ii}" ${state[itemKey(ci,ii)] ? 'checked':''} data-ci="${ci}" data-ii="${ii}">
              <label for="chk-${ci}-${ii}">${txt}</label>
            </div>
          `).join("")}
        </div>
      </div>
    `;
    container.appendChild(catEl);

    catEl.querySelector(".cat-head").addEventListener("click", () => {
      catEl.classList.toggle("open");
    });

    catEl.querySelectorAll("input[type=checkbox]").forEach(chk => {
      chk.addEventListener("click", (e) => e.stopPropagation());
      chk.addEventListener("change", (e) => {
        const k = itemKey(e.target.dataset.ci, e.target.dataset.ii);
        state[k] = e.target.checked;
        saveState();
        render();
      });
    });
  });

  const overallPct = totalWeight ? Math.round((weightedScore/totalWeight)*100) : 0;
  document.getElementById("pctText").textContent = overallPct + "%";
  document.getElementById("scoreCircle").style.setProperty("--pct", overallPct);
  document.getElementById("mainBar").style.width = overallPct + "%";
  document.getElementById("statsText").textContent = `${doneItems} من ${totalItems} شاهد مكتمل عبر ${DATA.length} عنصر تقييم`;
}

document.getElementById("expandAll").addEventListener("click", () => {
  document.querySelectorAll(".cat").forEach(c => c.classList.add("open"));
});
document.getElementById("collapseAll").addEventListener("click", () => {
  document.querySelectorAll(".cat").forEach(c => c.classList.remove("open"));
});
document.getElementById("resetAll").addEventListener("click", () => {
  if(confirm("هل تريدين تصفير كل التقدم المسجل؟ لا يمكن التراجع عن هذا.")){
    state = {};
    saveState();
    render();
  }
});

loadState();
render();
</script>

</body>
</html>
